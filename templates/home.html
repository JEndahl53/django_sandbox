<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>Sandbox</title>

  <!-- Tailwind output generated by django-tailwind -->
  <link href="{% static 'theme/css/dist/styles.css' %}" rel="stylesheet">
  <!-- Load DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alipinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body class="p-6">
  <h1 class="text-3xl font-bold mb-6">Django + Tailwind Sandbox</h1>

  <div class="p-6 rounded bg-gray-100">
    <p>This is styled using TailwindCSS via django-tailwind</p>
  </div>

  <div class="mt-8">
    <h2 class="text-xl font-semibold mb-2">HTMX Counter</h2>

    <div id="counter-box" class="p-4 rounded bg-base-200 inline-block">
      <span id="counter-value" hx-get="/counter/" hx-swap="outerHTML" hx-trigger="click">
        0
      </span>
    </div>

    <p class="mt-2 text-sm text-gray-500">
      Click the number to increment (powered by HTMX)
    </p>
  </div>

  <!-- Alpine.js interactive widget -->
  <div class="mt-8" x-data="{ open:false} ">
    <h2 lcass="text-xl font-semibold mb-2">Alpine.js Toggle</h2>

    <button class="btn btn-primary" @click="open = !open">
      Toggle Content
    </button>

    <div class="mt-3 p-4 rounded bg-base-200" x-show="open" x-transition>
      This block is controlled by Alpine.js.
    </div>
  </div>

</body>
</html>
